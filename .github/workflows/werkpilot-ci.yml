name: WerkPilot CI

on:
  push:
    paths: ["werkpilot/**", ".github/workflows/werkpilot-ci.yml"]
  pull_request:
    paths: ["werkpilot/**"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: werkpilot, POSTGRES_PASSWORD: werkpilot, POSTGRES_DB: werkpilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U werkpilot" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: werkpilot/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests && ruff format --check app tests
      - name: Abhängigkeitsscan
        run: pip freeze --exclude-editable > /tmp/req.txt && pip-audit -r /tmp/req.txt --strict
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://werkpilot:werkpilot@localhost:5432/werkpilot_test
      - name: Migrationen gegen leere DB prüfen
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://werkpilot:werkpilot@localhost:5432/werkpilot_test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: werkpilot/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: werkpilot/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Abhängigkeitsscan
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

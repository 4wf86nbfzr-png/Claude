.chk{display:flex;align-items:flex-start;gap:8px}.chk input{margin-top:3px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

    DB.users[uidn] = { id: uidn, email: email, full_name: v("#r-name"), password: pass, verified: true, is_operator: false };
    DB.tenants[tidn] = { id: tidn, name: company, slug: company.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""), trade: v("#r-trade"), contact_email: email, phone: null, address: null, settings: { signature: company, quote_followup_days: 5, appointment_lead_hours: 20, auto_reply_min_confidence: 0.8, auto_reply_enabled: false, weekly_report_enabled: true }, business_hours: { mon: [["08:00", "16:00"]], tue: [["08:00", "16:00"]], wed: [["08:00", "16:00"]], thu: [["08:00", "16:00"]], fri: [["08:00", "14:00"]], sat: [], sun: [] }, data_retention_days: 365, created_at: iso(now()), entitlements: { status: "trialing", plan: null, trial_ends_at: iso(new Date(now().getTime() + TRIAL_DAYS * DAY)), cancel_at_period_end: false }, members: [{ user_id: uidn, role: "owner" }], customers: [], inquiries: [], appointments: [], quotes: [], reports: [], tickets: [], events: [], ai_calls: 0, integrations: { contact_form: { status: "not_configured", config: {} }, email_inbound: { status: "not_configured", config: {} }, google_calendar: { status: "not_configured", config: {} }, crm_webhook: { status: "not_configured", config: {} }, email_outbound: { status: "not_configured", config: {} } }, invoices: [] };
    DB.admin.leads.unshift({ id: uid(), company: company, contact_name: v("#r-name"), email: email, trade: v("#r-trade"), size: null, source: "registration", consent_basis: "Registrierung (AGB akzeptiert)", fit_score: 60, fit_reasons: ["Zielgruppe"], status: "trial", next_action: "Einrichtung begleiten", next_action_at: iso(new Date(now().getTime() + 2 * DAY)), notes: "Testphase gestartet." });
    save(); setMsg("Fast geschafft: In der echten Software kommt jetzt eine Bestätigungsmail. Im Prototyp ist das Konto sofort bestätigt, Sie können sich anmelden.", "ok"); go("/anmelden?bestaetigt=1"); return;
  }
  if (id === "newInq") { var ni = createInquiry({ subject: v("#n-subject"), body: v("#n-body"), sender_name: v("#n-name"), sender_email: v("#n-email") || null, sender_phone: v("#n-phone") || null, channel: v("#n-channel") }); ui.showNew = false; save(); setMsg("Anfrage erfasst und eingeordnet: " + CAT[ni.category] + ", " + PRIO[ni.priority] + ".", "ok"); go("/app/anfragen/" + ni.id); render(); return; }
  if (id === "noteForm") { var ci = currentInquiry(); if (ci) { ci.messages.push({ id: uid(), direction: "note", sender: me().email, recipient: null, subject: "", body: v("#noteInput"), delivery_status: null, created_at: iso(now()) }); event("inquiry.note_added"); setMsg("Notiz gespeichert.", "ok"); } }
  else if (id === "quoteForm") { var cq = currentInquiry(); if (cq) { var amt = v("#q-amount"); t.quotes.unshift({ id: uid(), inquiry_id: cq.id, title: v("#q-title"), amount_cents: amt ? Math.round(Number(amt) * 100) : null, status: "open", sent_at: iso(now()), followup_count: 0, next_followup_at: iso(new Date(now().getTime() + Number(t.settings.quote_followup_days || 5) * DAY)), last_followup_at: null, created_at: iso(now()) }); cq.status = "quoted"; event("quote.created"); setMsg("Angebot eingetragen – Nachfass-Erinnerung läuft.", "ok"); } }
  else if (id === "custForm") { t.customers.push({ id: uid(), name: v("#c-name"), email: v("#c-email") || null, phone: v("#c-phone") || null, address: v("#c-address") || null, notes: v("#c-notes") || null, created_at: iso(now()) }); ui.showCust = false; event("customer.created"); setMsg("Kunde angelegt.", "ok"); }
  else if (id === "apptForm") { var st = new Date(v("#a-start")); if (isNaN(st)) { setMsg("Bitte einen Beginn wählen.", "bad"); } else { t.appointments.push({ id: uid(), inquiry_id: null, title: v("#a-title"), starts_at: iso(st), ends_at: iso(new Date(st.getTime() + Number(v("#a-dur") || 60) * 60000)), status: "confirmed", location: v("#a-loc") || null, external_calendar_id: t.integrations.google_calendar.status === "connected" ? "gcal_" + uid() : null, token: uid() }); setMsg("Termin gespeichert.", "ok"); } }
  else if (id === "crmForm") { var url = v("#crmUrl"); if (!/^https:\/\//.test(url)) { setMsg("Die Webhook-Adresse muss mit https:// beginnen.", "bad"); } else { t.integrations.crm_webhook = { status: "connected", config: { webhook_url: url } }; event("integration.changed", null, { type: "crm_webhook" }); setMsg("CRM Webhook gespeichert. Clairify sendet neue und geänderte Anfragen dorthin.", "ok"); } }
  else if (id === "inviteForm") { var ie = v("#i-email"); if (t.members.some(function (m) { return DB.users[m.user_id].email.toLowerCase() === ie.toLowerCase(); })) { setMsg("Diese Person ist schon Mitglied.", "bad"); } else { var nid = "u" + uid(); DB.users[nid] = { id: nid, email: ie, full_name: ie.split("@")[0], password: "einladung", verified: false, is_operator: false }; t.members.push({ user_id: nid, role: v("#i-role") }); event("member.invited"); setMsg("Einladung gesendet (7 Tage gültig). Im Prototyp erscheint die Person sofort als unbestätigt.", "ok"); } }
  else if (id === "ticketForm") { var ans = assistantAnswer(v("#t-subject") + " " + v("#t-body")); var tk = { id: uid(), subject: v("#t-subject"), category: ans ? "Produkt" : "Sonstiges", priority: "normal", status: ans ? "answered" : "escalated", escalation_reason: ans ? null : "Assistent fand keine sichere Antwort", created_at: iso(now()), messages: [{ id: uid(), author_type: "user", body: v("#t-body"), created_at: iso(now()) }] }; if (ans) tk.messages.push({ id: uid(), author_type: "agent", body: ans, created_at: iso(now()) }); else tk.messages.push({ id: uid(), author_type: "agent", body: "Dazu kann ich nichts Sicheres sagen. Ich habe den Fall an das Clairify-Team weitergegeben, Sie bekommen eine Antwort per E-Mail.", created_at: iso(now()) }); t.tickets.unshift(tk); ui.ticket = tk.id; event("ticket.created"); setMsg(ans ? "Der Assistent hat sofort geantwortet." : "An einen Menschen weitergegeben.", "ok"); }
  else if (id === "ticketReply") { var tr = t.tickets.find(function (x) { return x.id === ui.ticket; }); if (tr) { tr.messages.push({ id: uid(), author_type: "user", body: v("#t-reply"), created_at: iso(now()) }); if (tr.status === "answered") { tr.status = "escalated"; tr.escalation_reason = "Rückfrage des Kunden"; tr.messages.push({ id: uid(), author_type: "agent", body: "Danke, ich gebe Ihre Rückfrage an das Clairify-Team weiter.", created_at: iso(now()) }); } } }
  else if (id === "tenantForm") { t.name = v("#s-name"); t.trade = v("#s-trade"); t.contact_email = v("#s-email") || null; t.phone = v("#s-phone") || null; t.address = v("#s-address") || null; event("settings.saved"); setMsg("Gespeichert.", "ok"); }
  else if (id === "autoForm") { t.settings = { signature: v("#s-sig"), quote_followup_days: Number(v("#s-fu")) || 5, appointment_lead_hours: Number(v("#s-lead")) || 20, auto_reply_min_confidence: Number(v("#s-conf")) || 0.8, auto_reply_enabled: $("#s-auto", form).checked, weekly_report_enabled: $("#s-weekly", form).checked }; event("settings.saved"); setMsg("Gespeichert.", "ok"); }
  else if (id === "delForm") { if (v("#delConfirm") !== t.slug) { setMsg("Die Eingabe stimmt nicht mit „" + t.slug + "“ überein.", "bad"); } else if (t.entitlements.status === "active" && !t.entitlements.cancel_at_period_end) { setMsg("Ein aktives Abo muss vorher gekündigt sein.", "bad"); } else { delete DB.tenants[t.id]; DB.session = { userId: null, tenantId: null }; if (!Object.keys(DB.tenants).length) { reset(); } save(); go("/anmelden"); toast("Betrieb gelöscht."); return; } }
  else if (id === "expForm") { DB.admin.expenses.push({ id: uid(), category: v("#x-cat"), vendor: v("#x-vendor"), amount_cents: Math.round(Number(v("#x-amount")) * 100), period_month: v("#x-month"), note: v("#x-note") }); setMsg("Ausgabe gespeichert.", "ok"); }
  else if (form.getAttribute("data-plan")) { var p = DB.plans.find(function (x) { return x.code === form.getAttribute("data-plan"); }); try { var lim = JSON.parse($('[name=limits]', form).value); p.name = $('[name=name]', form).value; p.description = $('[name=description]', form).value; p.price_cents_monthly = Math.round(Number($('[name=price]', form).value) * 100); p.stripe_price_id = $('[name=stripe_price_id]', form).value || ""; p.features = $('[name=features]', form).value.split(",").map(function (s) { return s.trim(); }).filter(Boolean); p.limits = lim; p.is_active = $('[name=is_active]', form).checked; p.is_public = $('[name=is_public]', form).checked; setMsg("Tarif " + p.code + " gespeichert.", "ok"); } catch (e) { setMsg("Fehler (Limits müssen gültiges JSON sein)", "bad"); } }
  else if (form.getAttribute("data-admin-reply")) { var tn2 = DB.tenants[form.getAttribute("data-tn")], tid2 = form.getAttribute("data-admin-reply"), tx = tn2.tickets.find(function (x) { return x.id === tid2; }); if (tx) { tx.messages.push({ id: uid(), author_type: "human", body: $("textarea", form).value.trim(), created_at: iso(now()) }); tx.status = "answered"; setMsg("Antwort gesendet (per E-Mail an den Kunden, im Prototyp simuliert).", "ok"); } }
  save(); render();
}
function afterRender() {
  var s = $("#inqSearch") || $("#custSearch"); if (s) { s.addEventListener("input", function () { ui.q = s.value; var pos = s.selectionStart; render(); var n = $("#inqSearch") || $("#custSearch"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }
  var oo = $("#openOnly"); if (oo) oo.addEventListener("change", function () { ui.openOnly = oo.checked; render(); });
  var qs = $("#quoteStatus"); if (qs) qs.addEventListener("change", function () { ui.quoteStatus = qs.value; render(); });
  var ag = $("#agentSel"); if (ag) ag.addEventListener("change", function () { ui.agent = ag.value; render(); });
  var ats = $("#adminTicketStatus"); if (ats) ats.addEventListener("change", function () { ui.adminTicketStatus = ats.value; render(); });
  var ss = $("#statusSel"); if (ss) ss.addEventListener("change", function () { var ci = currentInquiry(); if (ci) { ci.status = ss.value; event("inquiry.status", null, { status: ss.value }); setMsg("Status geändert.", "ok"); save(); render(); } });
  var ts = $("#tenantsel"); if (ts) ts.addEventListener("change", function () { DB.session.tenantId = ts.value; save(); render(); });
  document.querySelectorAll("[data-role]").forEach(function (sel) { sel.addEventListener("change", function () { var m = tenant().members.find(function (x) { return x.user_id === sel.getAttribute("data-role"); }); if (m) { m.role = sel.value; setMsg("Rolle geändert.", "ok"); save(); render(); } }); });
  document.querySelectorAll("[data-lead]").forEach(function (sel) { sel.addEventListener("change", function () { var l = DB.admin.leads.find(function (x) { return x.id === sel.getAttribute("data-lead"); }); if (l) { l.status = sel.value; save(); toast("Status gespeichert."); } }); });
  document.querySelectorAll("[data-hday]").forEach(function (cb) { cb.addEventListener("change", function () { ui.hours[cb.getAttribute("data-hday")] = cb.checked ? [["08:00", "16:00"]] : []; render(); }); });
  document.querySelectorAll("[data-hfrom],[data-hto]").forEach(function (inp) { inp.addEventListener("change", function () { var k = inp.getAttribute("data-hfrom") || inp.getAttribute("data-hto"); var w = ui.hours[k][0]; if (inp.hasAttribute("data-hfrom")) w[0] = inp.value; else w[1] = inp.value; }); });
  var ret = $("#s-ret"); if (ret) ret.addEventListener("change", function () { tenant().data_retention_days = Number(ret.value) || 365; save(); toast("Aufbewahrung gespeichert."); });
}
document.addEventListener("click", function (e) { var el = e.target.closest("[data-act]"); if (!el) return; e.preventDefault(); act(el.getAttribute("data-act"), el); });
document.addEventListener("submit", function (e) { var f = e.target; if (f.tagName === "FORM") { e.preventDefault(); if (!f.checkValidity()) { f.reportValidity(); return; } submit(f); } });
window.addEventListener("hashchange", render);
load();
try { var sess = JSON.parse(localStorage.getItem("clairify-prototyp-session") || "null"); if (sess && DB.users[sess.userId] && DB.tenants[sess.tenantId]) DB.session = sess; } catch (e) {}
var _save = save; save = function () { _save(); try { if (DB.session.userId) localStorage.setItem("clairify-prototyp-session", JSON.stringify(DB.session)); } catch (e) {} };
render();
})();

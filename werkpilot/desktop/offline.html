<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Clairify</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5f2;color:#16181d;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.box{max-width:420px;padding:32px;text-align:center}h1{font-size:1.4rem;margin:0 0 8px}p{color:#3a3f4b;margin:0 0 20px}button{font:inherit;border:0;border-radius:999px;padding:10px 20px;background:#1d4ed8;color:#fff;cursor:pointer}code{font-size:.8rem;color:#5b6270}</style></head>
<body><div class="box"><h1>Keine Verbindung zu Clairify</h1><p>Der Server ist gerade nicht erreichbar. Prüfen Sie die Internetverbindung und versuchen Sie es erneut.</p><button id="retry">Erneut versuchen</button><p style="margin-top:16px"><code id="info"></code></p></div>
<script>var q=new URLSearchParams(location.search);document.getElementById("info").textContent=q.get("fehler")||"";document.getElementById("retry").onclick=function(){location.href=q.get("url")};</script></body></html>

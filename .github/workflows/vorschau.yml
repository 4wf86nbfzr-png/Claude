# ============================================================
# Interne Vorschau auf GitHub Pages
# ------------------------------------------------------------
# Veröffentlicht den Stand dieses Branches unter
#   https://4wf86nbfzr-png.github.io/Claude/
# damit Kolleginnen und Kollegen die Seite im Browser testen
# können — ohne Konto, ohne Installation.
#
# Das ist NICHT der Live-Auftritt. Die Seiten tragen weiterhin
# noindex, Suchmaschinen nehmen sie also nicht auf. Wer die
# Adresse kennt, kann sie allerdings öffnen — für echten
# Zugriffsschutz siehe README.md.
#
# Läuft bei jedem Push auf den Branch und lässt sich unter
# "Actions" auch von Hand starten.
#
# Die Aktionen sind auf einen Commit festgenagelt statt auf ein
# Versionsschild wie @v4. Das verlangt die Einstellung dieses
# Repositories ("all actions must be pinned to a full-length
# commit SHA") — und es ist ohnehin der sichere Weg: ein Schild
# lässt sich verschieben, ein Commit nicht. Wer aktualisiert,
# holt sich den neuen Commit mit
#   git ls-remote --tags https://github.com/actions/checkout
# und zieht den Kommentar dahinter nach.
# ============================================================
name: Interne Vorschau

on:
  push:
    branches: [claude/peaceful-thompson-9gihsv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft eine Veröffentlichung noch, wird sie nicht abgebrochen,
# sondern die neue reiht sich dahinter ein.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Quellstand holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pages einrichten
        # enablement schaltet Pages beim ersten Lauf selbst frei,
        # damit niemand es in den Einstellungen suchen muss.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Nur die Website einsammeln
        # Vorher ging das ganze Repository hoch — mit dem kompletten
        # Quellcode des Planers. Der gehört nicht auf eine Seite, die
        # jeder öffnen kann, der die Adresse kennt, und er hat mit der
        # Vorschau der Website nichts zu tun. Also nur das, was zur
        # Website gehört.
        #
        # .nojekyll muss mit: ohne diese Datei verschluckt GitHub
        # Ordner mit Unterstrich.
        run: |
          set -euo pipefail
          mkdir -p _vorschau
          cp -r assets dienstleistungen _vorschau/
          cp ./*.html robots.txt sitemap.xml _vorschau/
          touch _vorschau/.nojekyll
          echo "Für die Vorschau gepackt:"
          find _vorschau -type f | wc -l

      - name: Seite packen
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _vorschau

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Adresse ausgeben
        run: echo "Vorschau liegt unter ${{ steps.deploy.outputs.page_url }}"

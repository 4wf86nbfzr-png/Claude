# Reverse Proxy fuer den HST Planer.
#
#   sudo cp betrieb/nginx-hst-planer.conf /etc/nginx/sites-available/hst-planer
#   sudo ln -s /etc/nginx/sites-available/hst-planer /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d planer.hermserviceteam.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zwei Dinge sind hier nicht Geschmackssache:
#   * TLS. Ohne https ist das Sitzungs-Cookie nicht "secure" und die Anwendung
#     verschickt Personaldaten im Klartext ueber das Netz.
#   * X-Forwarded-For. Ohne diesen Kopf sieht die Anwendung nur die IP des
#     Proxys – dann greift die Anmeldebremse fuer alle Besucher gemeinsam,
#     und im Protokollbuch steht bei jedem Eintrag dieselbe Adresse.

server {
    listen 80;
    listen [::]:80;
    server_name planer.hermserviceteam.com;
    # Alles auf https. Den ACME-Pfad laesst certbot selbst stehen.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name planer.hermserviceteam.com;

    # certbot traegt diese beiden Zeilen selbst ein.
    # ssl_certificate     /etc/letsencrypt/live/planer.hermserviceteam.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/planer.hermserviceteam.com/privkey.pem;

    # Dokumente und Stundenzettel koennen groesser sein als die 1 MB, die
    # nginx von Haus aus durchlaesst. Passend zu MAX_UPLOAD_MB in der .env.
    client_max_body_size 25m;

    # Ein Export ueber viele Monate rechnet laenger als die 60 Sekunden,
    # nach denen nginx sonst abbricht.
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fuer den Fall, dass spaeter etwas ueber eine offene Verbindung laeuft.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Die Sicherheitskoepfe setzt die Anwendung selbst (next.config.ts) –
        # hier nichts doppeln, sonst stehen sie zweimal im Kopf.
        proxy_buffering off;
    }
}

# ============================================================
# Team Kornkammer — Konfiguration für Netlify
# ------------------------------------------------------------
# Veröffentlichungsordner ist dieser Ordner (kornkammer/). Kein
# Build-Schritt. Die Produktseiten werden vorab lokal erzeugt:
#   node tools/build-produkte.mjs
# Die Formulare (kontakt, bestellanfrage) tragen data-netlify="true";
# Empfänger unter Forms → Form notifications eintragen:
#   Team-Kornkammer@gmx.de
# Der Abschnitt TESTBETRIEB hält Suchmaschinen fern. Vor dem Live-Gang
# die drei markierten Stellen anfassen (hier, robots.txt, <meta robots>
# in jeder Seite und im Generator).
# ============================================================

[build]
  base = "kornkammer"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # ---- TESTBETRIEB: VOR DEM LIVE-GANG ENTFERNEN (1 von 3) ----
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Alles liegt im Projekt; nichts wird von fremden Servern geladen.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Adressen ohne .html ----
[[redirects]]
  from = "/hof"
  to = "/hof.html"
  status = 200
[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200
[[redirects]]
  from = "/arbeit"
  to = "/arbeit.html"
  status = 200
[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 200
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200
[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200
[[redirects]]
  from = "/shop/produkte/:id"
  to = "/shop/produkte/:id.html"
  status = 200

# ---- Alte Adressen der bisherigen Website ----
# Die Bestandsseite hieß z. B. "der hof.htm" (mit Leerzeichen). Damit

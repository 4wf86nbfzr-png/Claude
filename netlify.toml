# ============================================================
# HERM Service Team — Konfiguration für Netlify
# ------------------------------------------------------------
# Diese Datei genügt für einen Deploy: Repository in Netlify
# verbinden, kein Build-Befehl, Veröffentlichungsordner ist die
# Wurzel. Alles Weitere steht hier.
#
# Der Abschnitt "TESTBETRIEB" hält Suchmaschinen fern. Vor dem
# Live-Gang die drei markierten Stellen anfassen — sonst bleibt
# die Seite unsichtbar.
# ============================================================

[build]
  publish = "."
  # Kein Build-Schritt: die Website ist reines HTML/CSS/JS.
  command = ""
  functions = "netlify/functions"

[functions]
  # ---- Warum "zisi" und nicht der neuere Bündler ----
  # esbuild fasst die Funktion samt Abhängigkeiten in eine Datei zusammen.
  # Dabei verliert `__dirname` seine Bedeutung, und Pakete, die zur Laufzeit
  # eigene Dateien nachladen, finden sie nicht mehr. zisi kopiert stattdessen
  # node_modules mit — langsamer, dafür verhält sich alles wie lokal.
  node_bundler = "zisi"
  # Die Schriftmetriken von pdfkit sind Datendateien, keine require()-Aufrufe;
  # ein Bündler sieht sie nicht. Diese Zeile nimmt sie ausdrücklich mit.
  # (Der Beleg benutzt inzwischen die Standalone-Fassung, die sie eingebettet
  # trägt — die Zeile bleibt als Netz für den Fall, dass jemand zurückstellt.)
  included_files = ["node_modules/pdfkit/js/data/**"]

# ---- Die Formularfunktion ----
# Auf Netlify liegt sie unter /.netlify/functions/formular. Die Website ruft
# aber /api/formular auf — genau wie auf Vercel. Diese Regel verbindet beides,
# damit im Browser kein Unterschied besteht.
# Sie muss VOR der 404-Regel ganz unten stehen.
[[redirects]]
  from = "/api/formular"
  to = "/.netlify/functions/formular"
  status = 200
  force = true

# ---- Netlify Forms ----
# Die Formulare tragen data-netlify="true"; Netlify erkennt sie beim Deploy
# und sammelt die Eingänge unter "Forms". Das ist der Auffangweg: Solange die
# Zugangsdaten des Postfachs fehlen, antwortet die Funktion mit 503, und die
# Website reicht an Netlify Forms weiter. Kein Eingang geht verloren.
# Weiterleitung per Mail: Netlify → Forms → Settings → Form notifications

[[headers]]
  for = "/*"
  [headers.values]
    # ---- TESTBETRIEB: VOR DEM LIVE-GANG ENTFERNEN (1 von 3) ----
    # Sperrt die Vorschau für Suchmaschinen, auch wenn jemand die
    # Meta-Angabe in einer Seite übersieht.
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

    # ---- Sicherheit ----
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Die Seite lädt nichts von fremden Servern — Schriften, Bilder und
    # der Film liegen im Projekt. Deshalb darf die Richtlinie eng sein.
    # 'unsafe-inline' ist nötig für die wenigen Inline-Stile im Markup
    # und die eine Zeile im <head>, die die JS-Sperre aufhebt.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# ---- Zwischenspeicher ----
# Bilder, Schriften und Video ändern sich selten und tragen einen
# festen Namen: lange speichern. HTML dagegen immer frisch holen,
# sonst sehen Kollegen im Test noch die Fassung von gestern.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Adressen ohne .html ----
# /kontakt statt /kontakt.html — schöner und nach dem Live-Gang
# die Adressen, die man weitergibt.
[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 200
[[redirects]]
  from = "/jobs"
  to = "/jobs.html"
  status = 200
[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200
[[redirects]]
  from = "/galerie"
  to = "/galerie.html"
  status = 200
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200
[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200
# Die Uebersichtsseite liegt als dienstleistungen.html neben dem gleichnamigen
# Ordner. Diese Regel muss vor der fuer die Unterseiten stehen.
[[redirects]]
  from = "/dienstleistungen"
  to = "/dienstleistungen.html"
  status = 200
[[redirects]]
  from = "/dienstleistungen/:name"
  to = "/dienstleistungen/:name.html"
  status = 200

# Alles Unbekannte auf die Fehlerseite, mit korrektem Statuscode.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[project]
name = "werkpilot-backend"
version = "0.1.0"
description = "WerkPilot AI – KI-gestützte Anfrage- und Terminautomatisierung für Handwerksbetriebe"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "aiosqlite>=0.21",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "email-validator>=2.2",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "stripe==16.0.0",
  "redis==8.1.0",
  "structlog==26.1.0",
  "python-multipart>=0.0.20",
  "anthropic==1.13.0",
  "openai==3.29.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff>=0.9",
  "pip-audit>=2.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP047"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

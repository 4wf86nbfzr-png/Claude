# HST Planer – Datenbank und Anwendung.
#
#   docker compose up -d --build
#   docker compose run --rm werkzeuge npx prisma migrate deploy
#   docker compose run --rm werkzeuge npm run seed   # nur fuer eine Testumgebung
#
# Der Dienst "planer" traegt nur die Laufzeit. Migrationen und Seed laufen ueber
# "werkzeuge" – dort sind Prisma-CLI und tsx vorhanden.
#
# Die Geheimnisse stehen in der .env neben dieser Datei.

services:
  datenbank:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-hstplaner}
      # Deutsche Sortierung, damit "Möller" dort steht, wo man ihn sucht.
      LANG: de_DE.utf8
    volumes:
      - hst-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hst} -d ${POSTGRES_DB:-hstplaner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Die Datenbank ist nur fuer die Anwendung erreichbar, nicht von aussen.
    expose:
      - "5432"

  planer:
    build: .
    restart: unless-stopped
    depends_on:
      datenbank:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hst}:${POSTGRES_PASSWORD}@datenbank:5432/${POSTGRES_DB:-hstplaner}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PUBLIC_API_ORIGINS: ${PUBLIC_API_ORIGINS:-}
      PUBLIC_REQUEST_LIMIT: ${PUBLIC_REQUEST_LIMIT:-5}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-993}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_MAILBOX: ${EMAIL_MAILBOX:-INBOX}
      EMAIL_PROCESSED_MAILBOX: ${EMAIL_PROCESSED_MAILBOX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DISPO_NOTIFY_EMAIL: ${DISPO_NOTIFY_EMAIL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - hst-storage:/app/storage

  # Einmalige Aufgaben: Migrationen, Seed, Postfachabruf, taegliche Jobs.
  # Startet nicht mit "up", sondern nur ueber "docker compose run --rm werkzeuge …".
  werkzeuge:
    build:
      context: .
      target: builder
    profiles: ["werkzeuge"]
    depends_on:
      datenbank:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hst}:${POSTGRES_PASSWORD}@datenbank:5432/${POSTGRES_DB:-hstplaner}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-993}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_MAILBOX: ${EMAIL_MAILBOX:-INBOX}
      EMAIL_PROCESSED_MAILBOX: ${EMAIL_PROCESSED_MAILBOX:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - hst-storage:/app/storage
    entrypoint: ["sh", "-c"]
    command: ["echo 'Beispiel: docker compose run --rm werkzeuge npx prisma migrate deploy'"]

volumes:
  hst-db:
  hst-storage:
